[project]
name = "hh_clone"
version = "1.0.0"
description = "by G么MEPE"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.136.1",
    "sqlalchemy[asyncio]==2.0.49",
    "asyncpg==0.31.0",
    "python-dotenv==1.2.2",
    "uvicorn==0.46.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.13.1",
    "bcrypt==5.0.0",
    "passlib==1.7.4",
    "authx==1.6.0",
    "prometheus-client==0.25.0",
    "prometheus-fastapi-instrumentator==7.1.0",
    "python-jose[cryptography]==3.5.0",
    "slowapi==0.1.9",
    "redis==7.4.0",
]

[dependency-groups]
dev = [
    "ruff==0.15.12",
    "black==26.3.1",
    "mypy==2.0.0"
]

[tool.ruff]
line-length = 120
lint.select = ["E", "F", "W", "I", "C", "B", "A", "RUF", "FAST"]
lint.ignore = ["E501", "B008"]
target-version = "py312"
exclude = ["tests/*", "pyproject.toml", ".venv/*"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true 
disallow_untyped_defs = true
strict = true
